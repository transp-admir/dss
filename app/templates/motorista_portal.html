<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Motorista</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/portal_motorista.css') }}">
</head>
<body>
    <div class="portal-container">
        <h1 class="welcome-message">Bem-vindo, <span>{{ motorista.nome }}</span>!</h1>
        <p class="portal-subtitle">Selecione uma das opções abaixo para continuar.</p>
        
        <div class="options-grid">
            <a href="#" class="option-card dss disabled">
                <i class="fas fa-file-signature"></i>
                <span>Acessar DSS</span>
            </a>
            <a href="{{ url_for('main.lista_checklists_motorista') }}" class="option-card checklist">
                <i class="fas fa-clipboard-check"></i>
                <span>Fazer Checklist</span>
            </a>
            <a href="#" class="option-card documentos disabled">
                <i class="fas fa-folder-open"></i>
                <span>Biblioteca de Documentos</span>
            </a>
            <a href="https://drive.google.com/drive/folders/1lD2QokjiM5dZXUABPd-Ck8X1nmIKpdv9?usp=drive_link" class="option-card tutoriais" target="_blank">
                <i class="fas fa-video"></i>
                <span>Ver Tutoriais</span>
            </a>
        </div>

        <p class="info-message">
            Encontrou algum erro nos seus dados? Entre em contato com o suporte.
        </p>

        <a href="{{ url_for('main.logout') }}" class="logout-link">Sair</a>
    </div>

    <a href="https://wa.me/+55 18 98143-0410" class="whatsapp-fab" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>
</body>
</html>
